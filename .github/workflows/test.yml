name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:               # <- job_id. YAML의 키 이름이자 기본 식별자
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest