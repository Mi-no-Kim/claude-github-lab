name: 버그 제보
description: 예상과 다르게 동작하는 부분을 알려주세요.
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 예상한 동작과 실제 동작을 함께 적어주세요.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 낮음
        - 보통
        - 높음
    validations:
      required: true