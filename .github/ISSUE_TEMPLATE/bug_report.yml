name: 🐞 버그 제보
description: 예상과 다르게 동작하는 부분을 알려주세요.
title: "[Bug] "
labels: ["type: bug", "status: todo"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 제보해주셔서 감사합니다. 아래 항목을 최대한 구체적으로 채워주세요.
  - type: checkboxes
    id: existing-search
    attributes:
      label: 중복 확인
      options:
        - label: 이미 등록된 이슈가 없는지 검색해봤습니다.
          required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상한 동작
      description: 어떤 동작을 기대했는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떤 일이 일어났는지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 순서대로 적어주세요.
      placeholder: |
        1. '...'로 이동
        2. '...'를 클릭
        3. 에러 확인
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 실행 환경
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 버전
      placeholder: 예) v1.2.0
    validations:
      required: false
